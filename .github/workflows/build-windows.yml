name: Build Windows Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9" # 如果编译报错，可以尝试换成 3.24.0 或 3.19.0
          channel: 'stable'
          cache: true

      - name: Ensure Windows desktop support
        shell: bash
        run: |
          if [ ! -d "windows" ]; then
            echo "windows/ 目录不存在，正在自动创建..."
            flutter create --platforms=windows .
          else
            echo "windows/ 目录已存在。"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pubspec_overrides.yaml ]; then
            mv pubspec_overrides.yaml "$RUNNER_TEMP/pubspec_overrides.yaml.disabled"
          fi
          flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: GardendlessLoader-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          archive: true
